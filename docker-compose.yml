services:
  clinical-pipeline:
    build:
      context: .
      args:
        OPENAI_API_KEY: ${OPENAI_API_KEY}
        PINECONE_API_KEY: ${PINECONE_API_KEY}
    image: clinical-pipeline
    container_name: clinical-pipeline
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_ENV=${PINECONE_ENV}
    volumes:
      - ./notes:/app/data
    ports:
      - "3000:3000"
    network_mode: host
    restart: unless-stopped